name: Desktop installer (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run dist:win
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: CAD-Viewer-3D-Setup
          path: release/*.exe
      # Tag pushes publish that tag; manual runs publish v<package.json version>.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: CAD Viewer 3D ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          body: |
            Bộ cài Windows (64-bit) của CAD Viewer 3D.
            Tải **CAD-Viewer-3D-Setup-*.exe**, chạy và làm theo hướng dẫn cài đặt.
