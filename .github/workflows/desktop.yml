name: Desktop installer (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: CAD-Viewer-3D-Setup
          path: release/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body: |
            Bộ cài Windows (64-bit) của CAD Viewer 3D.
            Tải **CAD-Viewer-3D-Setup-*.exe**, chạy và làm theo hướng dẫn cài đặt.
