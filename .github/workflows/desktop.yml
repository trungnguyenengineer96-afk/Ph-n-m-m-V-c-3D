name: Desktop installer (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Native STEP/IGES importer: OpenCascade from conda-forge, built with MSVC.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: occt
          create-args: occt
          cache-environment: true
      - name: Build native importer
        shell: pwsh
        run: |
          $lib = Join-Path $env:MAMBA_ROOT_PREFIX 'envs\occt\Library'
          Get-ChildItem -Recurse -Filter OpenCASCADEConfig.cmake $lib | Select-Object -First 1 FullName
          cmake -S native -B native/build -DCMAKE_PREFIX_PATH="$lib" -DCVIMPORT_DLL_DIRS="$lib/bin"
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build native/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          cmake --install native/build --config Release --prefix native-bin
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          Get-ChildItem native-bin | Sort-Object Length -Descending | Format-Table Name, Length
          "Total MB: {0:N1}" -f ((Get-ChildItem native-bin | Measure-Object Length -Sum).Sum / 1MB)
      # Run with a bare PATH to prove every DLL it needs is bundled.
      - name: Test native importer
        shell: pwsh
        run: |
          $env:PATH = 'C:\Windows\System32;C:\Windows'
          & .\native-bin\cvimport.exe public\samples\as1_pe_203_assembly.stp "$env:RUNNER_TEMP\as1.cvmesh"
          if ($LASTEXITCODE -ne 0) { throw "cvimport exited with $LASTEXITCODE" }
          & .\native-bin\cvimport.exe public\samples\C04_cube_hole_5mm.step "$env:RUNNER_TEMP\c04.cvmesh"
          if ($LASTEXITCODE -ne 0) { throw "cvimport exited with $LASTEXITCODE" }
          Get-Item "$env:RUNNER_TEMP\*.cvmesh" | Format-Table Name, Length
      - run: npm run dist:win
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: CAD-Viewer-3D-Setup
          path: release/*.exe
      # Tag pushes publish that tag; manual runs publish v<package.json version>.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: CAD Viewer 3D ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          body: |
            Bộ cài Windows (64-bit) của CAD Viewer 3D.
            Tải **CAD-Viewer-3D-Setup-*.exe**, chạy và làm theo hướng dẫn cài đặt.
            Bản cài kèm bộ đọc STEP/IGES OpenCascade gốc (nhanh hơn bản trình duyệt khoảng 2–2,5 lần).
